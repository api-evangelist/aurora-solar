        '200':
          description: Inverters successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inverters:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The ID of the inverter.
                        name:
                          type: string
                          description: The name of the inverter.
                          example: Aurora Sample Inverter
                        manufacturer:
                          type: string
                          description: The manufacturer of the inverter.
                          example: Aurora Solar
                        microinverter:
                          type: boolean
                          description: Whether the inverter is a microinverter.
                          example: false
                        nominal_output_voltage:
                          type:
                          - number
                          - 'null'
                          description: The nominal output voltage of the inverter in volts.
                          example: 240
                        rating_stc:
                          type:
                          - number
                          - 'null'
                          description: The inverter's STC rating in watts.
                          example: 350
                        cec_efficiency_pct:
                          type:
                          - number
                          - 'null'
                          description: The inverter's CEC efficiency percentage.
                          example: 97
                        weight:
                          type:
                          - number
                          - 'null'
                          description: The weight of the inverter in kilograms.
                          example: 20
                        spec_sheet_url:
                          type:
                          - string
                          - 'null'
                          description: A URL to the inverter's specification sheet.
                          example: https://www.example.com/inverter-spec-sheet
                        integrated_batteries:
                          type: array
                          description: Array of integrated batteries compatible with this inverter.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: The ID of the battery.
                              name:
                                type: string
                                description: The name of the battery.
                                example: Aurora Sample Battery
                              nominal_capacity:
