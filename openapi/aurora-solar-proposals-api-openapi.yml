    delete:
      tags:
      - Proposals
      summary: Delete Proposal
      description: Deletes a design's proposal.
      operationId: deleteDefaultProposal
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: design_id
        in: path
        description: The ID of the design to delete the default proposal for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Default Proposal successfully deleted.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
