        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    phase:
                      type: string
                      minLength: 1
                      enum:
                      - contacted
                      - scheduled
                      - attended
                      - nurturing
                  required:
