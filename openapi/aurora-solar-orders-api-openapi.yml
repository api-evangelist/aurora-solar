  /tenants/{tenant_id}/orders/{id}/sold:
    post:
      tags:
      - Orders
      operationId: soldOrder
      summary: Mark Order Sold
      description: Mark an order as sold. If `sale_date` is not provided, defaults to today's date (UTC).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        description: The ObjectId of the order
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the tenant the order belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sale_date:
                  type: string
                  minLength: 1
                  description: Date the order was sold. Most date formats are accepted (e.g. "2024-06-15", "06/15/2024", "June 15, 2024"). Defaults to today if omitted.
      responses:
        '200':
          description: Order successfully marked as sold
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        description: Unique ID identifying the order.
                      customer_first_name:
                        type: string
                        minLength: 1
                        description: First name of the customer who the order belongs to
                      customer_last_name:
                        type: string
                        minLength: 1
                        description: Last name of the customer who the order belongs to
                      customer_email:
                        type: string
                        minLength: 1
                        description: Email of the customer who the order belongs to
                      customer_phone:
                        type: string
                        minLength: 1
                        description: Phone of the customer who the order belongs to
                      customer_address:
                        type: string
                        minLength: 1
                        description: Address of the customer who the order belongs to
                      customer_address_components:
                        type: object
                        properties:
                          street_address:
                            type:
                            - string
                            - 'null'
                            description: Number and street of the customer address
                          city:
                            type:
                            - string
                            - 'null'
                            description: City of the customer address
                          region:
                            type:
                            - string
                            - 'null'
                            description: Region, state, or province of the customer address
                          postal_code:
                            type:
                            - string
                            - 'null'
                            description: Postal code of the customer address
                          country:
                            type:
