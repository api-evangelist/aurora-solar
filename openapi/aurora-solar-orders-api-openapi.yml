  /tenants/{tenant_id}/orders/{id}/decline:
    post:
      tags:
      - Orders
      operationId: declineOrder
      summary: Decline Order
      description: Decline an order
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        description: The ObjectId of the order
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the tenant the order belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disqualified_reason:
                  type: string
                  enum:
                  - aesthetics
                  - already_has_solar
                  - commercial_industrial
                  - could_not_be_reached
                  - could_not_get_financing
                  - hoa_restrictions
                  - installer_at_capacity
                  - mobile_home
                  - no_financial_benefit
                  - other
                  - outside_service_area
                  - roof_condition_age
                  - shading
                  description: Reason for order disqualification
                notes:
                  type:
                  - string
                  - 'null'
                  description: Additional notes. Required with disqualified_reason other
              required:
              - disqualified_reason
      responses:
        '200':
          description: Order successfully declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
