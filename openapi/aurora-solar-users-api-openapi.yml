          description: User successfully invited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the user.
                      tenant_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the tenant that the user belongs to.
                      first_name:
                        type: string
                        description: First name of the user.
                        example: Joe
                      last_name:
                        type: string
