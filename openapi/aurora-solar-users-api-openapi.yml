        in: path
        description: The ID of the tenant that the user is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the user to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the user.
                      tenant_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the tenant that the user belongs to.
                      first_name:
                        type: string
                        description: First name of the user.
                        example: Joe
                      last_name:
                        type: string
                        description: Last name of the user.
                        example: Solar
                      email:
                        type: string
                        format: email
                        description: Email address of the user.
                        example: jsolar@aurorasolar.com
                      account_status:
                        type: string
                        description: Status of the user.
                        example: active
                      phone:
                        type: string
                        description: User's phone number
                        example: (415) 360-9291
                      title:
                        type: string
                        description: User's job title
                        example: Engineer
                      job_function:
                        type: string
                        description: Job function of the user.
                        enum:
                        - executive_or_owner
                        - it_or_business_systems_manager
                        - project_manager
                        - operations
                        - engineering
                        - canvasser_setter
                        - marketing_manager
                        - sales_representative
                        - sales_manager
                        - designer
                        - design_manager
                        - other
                        example: executive_or_owner
                      external_provider_id:
                        type: string
                        description: The full identifying URL identifying this user on the identity providers sytem. Ex. "https://test.salesforce.com/id/00556000000X3J3AFA/00540000001ulvMAEA"
                        example: https://test.salesforce.com/id/00556000000X3J3AFA/00540000001ulvMAEA
                      role_id:
