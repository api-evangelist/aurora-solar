openapi: 3.2.0
info:
  title: Sync Teams API
  description: This Aurora Integration API allows authorized clients and 3rd parties to easily read, update, and create resources/objects with specific parameters within Aurora. You can find out more about Aurora Solar here.
  version: 2024.05.0
  contact:
    name: Aurora Solar Support
    email: support@aurorasolar.com
servers:
- url: https://api-sandbox.aurorasolar.com
  description: Sandbox Environment
security:
- bearerAuth: []
tags:
- name: Teams
paths:
  /tenants/{tenant_id}/teams:
    get:
      tags:
      - Teams
      summary: List Teams
      description: 'Returns a list of teams


        ---


        Teams are returned sorted in alphabetical order by name.'
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant to get teams for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Teams successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Unique ID identifying the team.
                      - type: object
                        properties:
                          name:
                            type: string
                            description: Name of the team.
                            example: The A Team
                          partner_id:
                            type: string
                            format: uuid
                            description: Unique ID identifying the partner.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
      operationId: getTenantsByTenantIdTeams
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: header
x-provenance:
  method: harvested
  publisher: Aurora Solar
  source: https://docs.aurorasolar.com/openapi/aurora_sync_api_spec_oas.yaml
