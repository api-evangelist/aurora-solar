        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incentive:
                  allOf:
                  - type: object
                    properties:
                      name:
                        type: string
                        description: The name of the incentive.
                        example: State Rebate
                      amount:
                        type: number
                        description: The value of the incentive. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                        example: 500
                        exclusiveMinimum: 0
                      year_applied:
                        type:
                        - integer
                        - 'null'
                        default: 0
                        description: Which year (relative to project life, starting with 0) the incentive will be applied in. Year 0 incentives will reduce the financed amount for a cash or loan financing.
                        example: 0
                      incentive_scope:
                        type: string
                        enum:
                        - national
                        - local
                        default: national
                        description: The scope of the incentive.
                        example: national
                      apply_local_tax:
                        type: boolean
                        default: false
                        description: Should local tax be applied to the incentive?
                        example: false
                      apply_national_tax:
                        type: boolean
                        default: false
                        description: Should national tax be applied to the incentive?
