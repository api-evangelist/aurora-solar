    put:
      tags:
      - Pricing
      summary: Update Design Pricing
      description: Update pricing for an existing design.
      operationId: updateDesignPricing
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to update pricing details for.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pricing:
                  type: object
                  description: 'Pricing fields to update. At least one field must be provided. `flat_system_price`, `price_per_watt`, and `line_items` are mutually exclusive — provide one solar pricing field, not more than one. `line_items` sets per-component solar prices and sets the solar pricing mode to `price breakdown`. `storage_flat_system_price` and `storage_line_items` are mutually exclusive. Either storage field can be provided alone or alongside a solar pricing field. `heat_pump_flat_system_price` and `heat_pump_line_items` are mutually exclusive. Either heat pump field can be provided alone or alongside a solar or storage pricing field.

                    '
                  properties:
                    flat_system_price:
                      type: number
                      description: Sets the flat system price for the design and sets the pricing mode to `flat system price`. Cannot be used with `price_per_watt` or `line_items`. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                      example: 40000
                    price_per_watt:
                      type: number
                      description: Sets the price per watt for the design and sets the pricing mode to `price per watt`. Cannot be used with `flat_system_price` or `line_items`. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`) per watt.
                      example: 1.99
                    line_items:
                      type: array
                      description: 'Sets component unit prices in the design''s solar price breakdown and sets the solar pricing mode to `price breakdown`. Send one item or several. `component_id` must match an existing solar line item in the design. The submitted unit price replaces any existing quantity-based price tiers for that component. Cannot be used with `flat_system_price` or `price_per_watt`.

                        '
                      items:
                        type: object
                        required:
                        - component_id
                        - price
                        properties:
                          component_id:
                            type: string
                            format: uuid
                            description: Solar component ID from `pricing_by_component`.
                            example: 8f3c1a20-6b4d-4e7a-9c15-2d8e0f4a6b31
                          price:
                            type: number
                            description: Price for one unit of the component. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                            example: 350
                    storage_flat_system_price:
                      type: number
                      description: Sets the flat system price for the storage design and sets the storage pricing mode to `flat system price`. Requires the design to have a storage design. Subject to the tenant's configured minimum/maximum storage flat price limits when set — a value outside those limits is rejected with a 422. Cannot be used with `storage_line_items`. Can be used alongside `flat_system_price`, `price_per_watt`, or `line_items`. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                      example: 8000
                    storage_line_items:
                      type: array
                      description: 'Sets component unit prices in the storage price breakdown and sets the storage pricing mode to `price breakdown`. Send one item or several. `component_id` must match an existing storage line item. The submitted unit price replaces any existing quantity-based price tiers for that component. Requires the design to have a storage design. Cannot be used with `storage_flat_system_price`. Can be used alongside `flat_system_price`, `price_per_watt`, or `line_items`.

                        '
                      items:
                        type: object
                        required:
                        - component_id
                        - price
                        properties:
                          component_id:
                            type: string
                            format: uuid
                            description: Storage component ID from `pricing_by_component`.
                            example: 1a9e7c54-3d2b-4f68-a071-5e6c8b9d0f24
                          price:
                            type: number
                            description: Price for one unit of the storage component. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                            example: 8000
                    heat_pump_flat_system_price:
                      type: number
                      description: Sets the flat system price for the heat pump and sets the heat pump pricing mode to `flat system price`. Requires the design to have a heat pump. Subject to the tenant's configured minimum/maximum heat pump flat price limits when set — a value outside those limits is rejected with a 422. Cannot be used with `heat_pump_line_items`. Can be used alongside a solar or storage pricing field. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                      example: 6000
                    heat_pump_line_items:
                      type: array
                      description: 'Sets component unit prices in the heat pump price breakdown and sets the heat pump pricing mode to `price breakdown`. Send one item or several. `component_id` must match an existing heat pump line item. The submitted unit price replaces any existing quantity-based price tiers for that component. Requires the design to have a heat pump. Cannot be used with `heat_pump_flat_system_price`. Can be used alongside a solar or storage pricing field.

                        '
                      items:
                        type: object
                        required:
                        - component_id
                        - price
                        properties:
                          component_id:
                            type: string
                            format: uuid
                            description: Heat pump component ID from `pricing_by_component`.
                            example: 4c2b8e17-9a60-4d35-b8f2-1e7c0a9d5b46
                          price:
                            type: number
                            description: Price for one unit of the heat pump component. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                            example: 4500
      responses:
        '200':
          description: Design Pricing successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing:
                    type: object
                    properties:
                      pricing_method:
                        type: string
                        enum:
                        - flat system price
                        - price breakdown
                        - price per watt
                        description: How is the design priced, excluding storage, energy optimization, and heat pump products.
                      flat_system_price:
                        type: number
                        format: double
                        description: The flat price of the system, excluding storage, energy optimization, and heat pump products. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                        example: 5000
                      price_per_watt:
                        type: number
                        format: double
                        description: The price per watt of the system, excluding storage, energy optimization, and heat pump products. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`) per watt.
                        example: 4.3
                      storage_pricing_method:
                        type: string
                        enum:
                        - flat system price
                        - price breakdown
                        description: How is the storage design priced.
                      storage_flat_system_price:
                        type: number
                        format: double
                        description: The flat price of the storage system. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                        example: 8000
                      heat_pump_pricing_method:
                        type:
                        - string
                        - 'null'
                        enum:
                        - flat system price
                        - price breakdown
                        description: How the heat pump is priced. `null` when no heat pump is configured on the design.
                      heat_pump_flat_system_price:
                        type:
                        - number
                        - 'null'
                        format: double
                        description: The flat price of the heat pump system. `null` when no heat pump is configured on the design. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                        example: 8000
                      energy_optimization_pricing_method:
                        type: string
                        enum:
                        - price breakdown
                        description: How the energy optimization components are priced.
                      pricing_by_component:
                        type: array
                        description: The list of physical components which make up the base price of the system.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the item.
                              example: Aurora Sample Solar Panel
                            manufacturer_name:
                              type: string
                              description: The name of the manufacturer. Only populated if the item is generated from a component.
                              example: Aurora Sample Manufacturer
                            component_id:
                              type:
                              - string
                              - 'null'
                              format: uuid
                              description: The ID of the component. Use with `component_type` to identify the component. `null` when the item is not generated from a component.
                              example: 8f3c1a20-6b4d-4e7a-9c15-2d8e0f4a6b31
                            price:
                              type: number
                              format: double
                              description: The price of the item.
                              example: 196.35
                            quantity:
                              type: integer
                              description: The number of items included.
                              example: 11
                            component_type:
                              type: string
                              description: Type of component i.e. [`"combiner_boxes"`, `"dc_optimizers"`, `"disconnects"`, `"inverters"`, `"load_centers"`, `"meters"`, `"microinverters"`, `"modules"`, `"service_panels"`, `"batteries"`, `"heat_pump_main_units"`]
                              example: modules
                      incentives:
                        type: array
                        description: All incentives applicable to the system.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the incentive.
                            name:
                              type: string
                              description: Name of the incentive.
                              example: Solar PV Energy Tax Credit - Personal
                            incentive_type:
                              type: string
                              enum:
                              - pbi
                              - cbi
                              - fixed_amount
                              description: Type of the incentive.
                              example: cbi
                            amount:
                              type: number
                              description: The value of the incentive, the unit depends on the incentive type. `pbi` are measured in the tenant's configured currency (see `currency` on `GET /tenants/{id}`) per watt. `cbi` are measured in percent of system price. `fixed_amount` are measured in the tenant's configured currency.
                              example: 25
                            disbursement:
                              type: string
                              enum:
                              - tax_credit_rebate
                              - cash_grant
                              description: How is the incentive disbursed?
                              example: tax_credit_rebate
                            duration:
                              type: number
                              description: How many years is the incentive disbursed over?
                              example: 10
                            cap:
                              type: number
                              description: If provided, the amount the incentive payment is capped to. Denominated in the tenant's configured currency (see `currency` on `GET /tenants/{id}`).
                              example: 35000
                            incentive_scope:
                              type: string
                              enum:
                              - national
                              - local
                              description: The scope of the incentive.
                              example: local
                            apply_local_tax:
                              type: boolean
                              description: Should local tax be applied to the incentive?
                            apply_national_tax:
                              type: boolean
                              description: Should national tax be applied to the incentive?
                            system_size_basis:
                              type: string
                              enum:
                              - ac
                              - stc
                              - ptc
                              description: If the incentive is of type `pbi`, which size rating should be considered?
                              example: stc
                            year_applied:
                              type: number
                              description: Which year (relative to project life, starting with 0) will the incentive be applied in?
                              example: null
                      adders:
                        type: array
