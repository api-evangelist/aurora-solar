        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the site survey to update mounting planes for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mounting_planes:
                  description: Array of mounting planes to store with the site survey.
                  type: array
                  items:
                    type: object
                    properties:
                      units_of_measurement:
                        type: string
                        minLength: 1
                        enum:
                        - Imperial
                        - Metric
                        description: The units of measurement to be used for the mounting planes. Uses the tenant default if not provided.
                        example: Imperial
                      pitch:
                        type: number
                        minimum: 0
                        maximum: 90
                        description: The pitch of the mounting plane, measured in degrees.
                        example: 21
                      azimuth:
                        type: number
                        minimum: 0
                        maximum: 360
                        description: The azimuth of the mounting plane, measured in degrees from North.
                        example: 180
                      roof_type:
                        type: string
                        minLength: 1
                        enum:
                        - composition_shingles
                        - tile_flat_concrete
                        - tile_s_concrete
                        - tile_w_concrete
                        - tile_slate
                        - tile_clay
                        - rolled_asphalt
                        - metal_standing_seam
                        - metal_corrugated
                        - other
                        description: The roof type of the mounting plane. If "other", specify in `notes`.
                        example: composition_shingles
                      framing_type:
                        type: string
                        minLength: 1
                        enum:
                        - trussed
                        - rafters
                        - other
                        description: The framing type of the mounting plane. If "other", specify in `notes`.
                        example: trussed
                      rafter_size:
                        type: string
                        minLength: 1
                        enum:
                        - 2x4
                        - 2x6
                        - 2x8
                        - 2x10
                        - 2x12
                        - other
                        description: The rafter size for the mounting plane. If "other", specify in `notes`.
                        example: 2x4
                      rafter_spacing:
                        type: number
                        description: The rafter spacing for the mounting plane. Provided in inches if units of measurement is Imperial or centimeters for Metric.
                        example: 24
                        exclusiveMinimum: 0
                      notes:
                        type: string
                        description: Any additional notes for the mounting plane.
                        example: Water damage around vent pipe
                      images:
                        description: List of images to associate with the mounting plane data.
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              minLength: 1
                              format: uri
