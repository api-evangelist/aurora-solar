  /tenants/{tenant_id}/site_surveys/{site_survey_id}/status:
    put:
      tags:
      - Site Surveys
      operationId: updateSiteSurveyStatus
      summary: Update Site Survey Status
      description: 'Updates status for a site survey.


        ---


        [block:callout]

        {

        "type": "warning",

        "body": "Please note that the Site Surveys API is in beta. As a beta product, the API will not be supported via our normal support channels. You may also experience some gaps and changes as the product is refined and documentation is updated before general release."

        }

        [/block]


        This endpoint is used to transition a site survey from one status to another, and validates conditions for that transition.


        Currently the only allowed status transition is from `in-progress` to `completed`, with the follow validations:


        - `electrical.main_panel_location` is filled out.

        - `electrical.main_bus_rating` is filled out.

        - `electrical.main_breaker_rating` is filled out.

        - For each mounting plane in `roofs.mounting_plane`:

        - `pitch` is filled out.

        - `azimuth` is filled out.

        - `roof_type` is filled out.

        - `framing_type` is filled out.

        - `rafter_size` is filled out.

        - `rafter_spacing` is filled out.'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the tenant the site survey belongs to
      - name: site_survey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the site survey to update status for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_survey:
                  type: object
                  properties:
                    status:
                      type: string
                      minLength: 1
                      enum:
                      - completed
                      description: The status of the site survey request. Currently only `completed` is allowed.
                  required:
                  - status
              required:
              - site_survey
      responses:
        '200':
          description: Status successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_survey:
                    type: object
                    properties:
