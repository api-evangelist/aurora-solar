      description: 'Updates mounting planes for a site survey. This will replace any previously uploaded mounting plane data.


        ---


        [block:callout]

        {

        "type": "warning",

        "body": "Please note that the Site Surveys API is in beta. As a beta product, the API will not be supported via our normal support channels. You may also experience some gaps and changes as the product is refined and documentation is updated before general release."

