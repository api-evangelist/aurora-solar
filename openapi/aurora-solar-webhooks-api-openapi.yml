openapi: 3.2.0
info:
  title: Sync Webhooks API
  description: This Aurora Integration API allows authorized clients and 3rd parties to easily read, update, and create resources/objects with specific parameters within Aurora. You can find out more about Aurora Solar here.
  version: 2024.05.0
  contact:
    name: Aurora Solar Support
    email: support@aurorasolar.com
servers:
- url: https://api-sandbox.aurorasolar.com
  description: Sandbox Environment
security:
- bearerAuth: []
tags:
- name: Webhooks
paths:
  /tenants/{tenant_id}/webhooks:
    post:
      tags:
      - Webhooks
      operationId: createWebhook
      summary: Create Webhook
      description: Create a new webhook.
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the tenant to create the webhook for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook:
                  description: Webhook to create.
                  type: object
                  properties:
                    event:
                      type: string
                      minLength: 1
                      description: The Aurora event which triggers the webhook to fire.
                      example: agreement_status_changed
                      enum:
                      - agreement_status_changed
                      - ahj_lookup_completed
                      - ai_roof_job_completed
                      - app_status_changed
                      - asset_created
                      - auto_designer_job_completed
                      - consumption_profile_changed
                      - design_created
                      - design_deleted
                      - design_request_completed
                      - design_request_created
                      - design_request_rejected
                      - eagleview_design_request_created
                      - eagleview_design_request_status_changed
                      - fire_pathway_placement_job_completed
                      - imagery_lidar_completed
                      - milestone_created
                      - milestone_shared
                      - order_created
                      - panel_irradiance_analysis_job_completed
                      - performance_simulation_job_completed
                      - plan_set_request_status_changed
                      - project_changed
                      - project_created
                      - project_deleted
                      - project_status_changed
                      - agreement_download_url_job_completed
                      - utility_bill_upload_job_completed
                      - proposal_pdf_generation_job_completed
                      - site_survey_requested
                      - site_survey_status_changed
                      - web_proposal_url_created
                      - web_proposal_viewed
                      - financier_contract_status_changed
                    url_template:
                      type: string
                      minLength: 1
                      description: URL template that GET requests are sent to when the event occurs
                      example: https://www.webhookclient.com/auto_designer_job_completed?design_id=<DESIGN_ID>&job_id=<JOB_ID>&status=<STATUS>
                    description:
                      type: string
                      description: Description of the webhook's purpose.
                      example: Aurora - AutoDesigner Webhook
                    enabled:
                      type: boolean
                      description: Whether the GET request will be sent on the next event occurrence. Default true.
                    header_auth_key:
                      type: string
                      description: Name of the HTTP header used for authentication to the url specified in url_template. Must be provided with header_auth_value or omitted; must not be provided with basic_auth_username or basic_auth_password.
                    header_auth_value:
                      type: string
                      description: Value of the HTTP header used for authentication to the url specified in url_template. Must be provided with header_auth_key or omitted; must not be provided with basic_auth_username or basic_auth_password.
                    basic_auth_username:
                      type: string
                      description: Username for authentication via basic auth to the url specified in url_template. Must be provided if basic_auth_password is provided; must not be provided with header_auth_key or header_auth_value.
                    basic_auth_password:
                      type: string
                      description: Password for authentication via basic auth to the url specified in url_template. Must not be provided with header_auth_key or header_auth_value.
                    filters:
                      description: The [Filters](ref:webhooks#filters) applied to this webhook. If multiple filters are supplied, all must be satisfied for the webhook to be triggered.
                      example:
                      - url_parameter: <STATUS>
                        values:
                        - submitted
                        - completed
                      type: array
                      items:
                        type: object
                        properties:
                          url_parameter:
                            type: string
                            minLength: 1
                            enum:
                            - <STATUS>
                            - <SOURCE>
                            - <ASSET_TYPE>
                            - <STAGE>
                            - <CHANGE_TYPES>
                            - <IS_FIRST_VIEW>
                            description: The URL parameter used to filter the webhook, including the brackets.
                            example: <STATUS>
                          values:
                            description: The list of values; if the URL parameter matches any value in the array, the webhook will be triggered.
                            type: array
                            items:
                              minLength: 1
                              type: string
                        required:
                        - url_parameter
                        - values
                  required:
                  - event
                  - url_template
              required:
              - webhook
      responses:
        '200':
          description: Webhook successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the webhook.
                      description:
                        type: string
                        minLength: 1
                        description: Description of the webhook's purpose.
                        example: Aurora - AutoDesigner Webhook
                      event:
                        type: string
                        enum:
                        - agreement_status_changed
                        - ahj_lookup_completed
                        - ai_roof_job_completed
                        - app_status_changed
                        - asset_created
                        - auto_designer_job_completed
                        - consumption_profile_changed
                        - design_created
                        - design_deleted
                        - design_request_completed
                        - design_request_created
                        - design_request_rejected
                        - eagleview_design_request_created
                        - eagleview_design_request_status_changed
                        - fire_pathway_placement_job_completed
                        - imagery_lidar_completed
                        - milestone_created
                        - milestone_shared
                        - order_created
                        - panel_irradiance_analysis_job_completed
                        - performance_simulation_job_completed
                        - plan_set_request_status_changed
                        - project_changed
                        - project_created
                        - project_deleted
                        - project_status_changed
                        - agreement_download_url_job_completed
                        - utility_bill_upload_job_completed
                        - proposal_pdf_generation_job_completed
                        - site_survey_requested
                        - site_survey_status_changed
                        - web_proposal_url_created
                        - web_proposal_viewed
                        - financier_contract_status_changed
                        description: The Aurora event which triggers the webhook to fire.
                        example: agreement_status_changed
                      url_template:
                        type: string
                        minLength: 1
                        description: URL template that GET requests are sent to when the event occurs.
                        example: https://www.webhookclient.com/auto_designer_job_completed?design_id=<DESIGN_ID>&job_id=<JOB_ID>&status=<STATUS>
                      enabled:
                        type: boolean
                        description: Whether the GET request will be sent on the next event occurrence.
                      credentials_enabled:
                        type: boolean
                        description: Whether credentials are attatched to this webhook.
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when the webhook was created in UTC
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when the webhook was last updated in UTC
                      filters:
                        description: The [Filters](ref:webhooks#filters) applied to this webhook. If multiple filters are supplied, all must be satisfied for the webhook to be triggered.
                        example:
                        - url_parameter: <STATUS>
                          values:
                          - submitted
                          - completed
                        type: array
                        items:
                          type: object
                          properties:
                            url_parameter:
                              type: string
                              minLength: 1
                              enum:
                              - <STATUS>
                              - <SOURCE>
                              - <ASSET_TYPE>
                              - <STAGE>
                              - <CHANGE_TYPES>
                              - <IS_FIRST_VIEW>
                              description: The URL parameter used to filter the webhook, including the brackets.
                              example: <STATUS>
                            values:
                              description: The list of values; if the URL parameter matches any value in the array, the webhook will be triggered.
                              type: array
                              items:
                                type: string
                          required:
                          - url_parameter
                          - values
                    required:
                    - id
                    - description
                    - event
                    - url_template
                    - enabled
                    - credentials_enabled
                    - created_at
                    - updated_at
                    - filters
                required:
                - webhook
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                example:
                  errors:
                  - message: 'Expected UUID but received non-UUID value for the following URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                example:
                  errors:
                  - message: Invalid bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                example:
                  errors:
                  - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                example:
                  errors:
                  - message: Something went wrong
                  - message: Something else went wrong
                  - message: It's not really your day, is it?
    get:
