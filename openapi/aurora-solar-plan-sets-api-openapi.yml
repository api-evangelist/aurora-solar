                                example: (415) 360-9291
                        electrical_information:
                          allOf:
                          - type: object
                            properties:
                              main_panel_location:
                                type: string
                                description: The location of the main service panel.
                                example: Below the meter
                              main_bus_rating:
                                type: number
                                format: integer
                                description: Busbar rating of the main service panel, in amperes. Must be a positive number.
                                example: 125
                                enum:
                                - 30
                                - 40
                                - 50
                                - 60
                                - 70
                                - 80
                                - 100
                                - 125
                                - 150
                                - 200
                                - 225
                                - 400
                              main_breaker_rating:
                                type: number
                                format: integer
                                description: Amperage rating of the main service panel disconnect.
                                example: 100
                                enum:
                                - 15
                                - 20
