        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Provided design was not found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The design with id db79f16a-8711-4ad4-a0eb-e370eee84092 could not be found
        '409':
          description: A plan set request already exists for the project.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 25a60c55-9578-4780-99c3-103b6806a1f9 already has a plan set request with id 7db5dd13-9784-49e9-a279-f79e37e6edd3
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: design_id is a required field
                    - message: The design with id db79f16a-8711-4ad4-a0eb-e370eee84092 has no modules. Please add modules to your design and try again.
                    - message: The project with id 25a60c55-9578-4780-99c3-103b6806a1f9 has no assets. Please upload at least one image or document to the project as a project asset and try again.
                    - message: electrical_information.main_panel_location is a required field
                    - message: electrical_information.main_bus_rating is a required field
                    - message: electrical_information.main_bus_rating must be a positive number
