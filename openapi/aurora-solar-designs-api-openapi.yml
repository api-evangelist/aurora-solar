  /tenants/{tenant_id}/designs/{design_id}/racking_arrays:
    get:
      tags:
      - Designs
      summary: List Racking Arrays
      description: 'Retrieve a list of arrays of modules that will likely be mounted together.


        ---


        Each racking array is a group of adjacent solar modules that have the same mounting plane, module model, azimuth, pitch, rotation, tilt, and orientation (portrait vs. landscape). This is similar to the definition of array used in the Design Summary endpoint, but electronics and stringing are not considered here. Modules are considered adjacent if the gap between them is less than a configurable distance (default 2.6cm) and they are aligned in a grid. If a module in one row or column is staggered so that it doesn''t align with the grid from the preceding row or column, it will not be included in the same array even if the modules are touching.


        Arrays are not listed in a guaranteed order, but within each array, rows are listed in order starting closest to the ridge line.


        Modules in filler rows and those that are offset from the grid (to avoid obstructions or match the roof shape) will be grouped into separate arrays.


        When arrays are adjacent but not aligned on the same grid, their relationship is communicated by the `adjacent_arrays` field, which lists all arrays that are contiguous with the current array. That includes arrays that are adjacent to the current array as well any arrays that are adjacent to an adjacent array, forming a contiguous group. See below for an example. The list contains information about each array, including its position in the list of racking arrays and the relative distance between the arrays. Note that adjacent arrays must still share a roof face, rotation, tilt, and module model.


        [block:image]

        {

        "images": [

        {

        "image": [

        "https://aurorasolar-backend-docs.s3.amazonaws.com/images/racking_arrays_roof_screenshot.png",

        "racking_arrays_roof_screenshot.png",

        "Example design with 4 adjacent racking arrays"

        ],

        "align": "center",

        "caption": "Example design with 4 adjacent racking arrays"

        }

        ]

        }

        [/block]


        The example design above contains four arrays that are contiguous. The adjacent_arrays object for each array shows how it is related to the other contiguous arrays in the design, measured from the center of the leftmost module on the top row in each array:


        ```json

        {

        "racking_arrays": [

        {

        "array_layout": [

        "LL"

        ],

        "adjacent_arrays": [

        {

        "idx": 1,

        "x": -12.08,

        "y": -4.64

        },

        {

        "idx": 2,

        "x": -18.40,

        "y": -10.19

        },

        {

        "idx": 3,

        "x": 4.55,

        "y": -10.19

        }

        ],

        ...

        },

        {

        "array_layout": [

        "PPPPPPP"

        ],

        "adjacent_arrays": [

        {

        "idx": 0,

        "x": 12.08,

        "y": 4.64

        },

        {

        "idx": 2,

        "x": -6.32,

        "y": -5.55

        },

        {

        "idx": 3,

        "x": 16.63,

        "y": -5.55

        }

        ],

        ...

        },

        {

        "array_layout": [

        "PPPPP"

        ],

        "adjacent_arrays": [

        {

        "idx": 0,

        "x": 18.40,

        "y": 10.19

        },

        {

        "idx": 1,

        "x": 6.32,

        "y": 5.55

        },

        {

        "idx": 3,

        "x": 22.96,

        "y": 0.0

        }

        ],

        ...

        },

        {

        "array_layout": [

        "PPPP"

        ],

        "adjacent_arrays": [

        {

        "idx": 0,

        "x": -4.55,

        "y": 10.19

        },

        {

        "idx": 1,

        "x": -16.63,

        "y": 5.55

        },

        {

        "idx": 2,

        "x": -22.96,

        "y": -0.0

        }

        ],

        ...

        }

        ]

        }

        ```

        Array 0, with landscape modules, is adjacent to array 1, the unbroken row of portrait modules. The distance from the leftmost module in array 0 to the leftmost module in array 1 is 12.08 feet to the left and 4.64 feet down. Array 1 is adjacent to all three of the other arrays; note that the x and y values relating array 1 to array 0 have the opposite signs to indicate that the module is to the right and up from this perspective.


        Array 0 is not directly adjacent to arrays 2 or 3, but because they are all contiguous, they are listed in adjacent_arrays for array 0 as well.


        Note that the distances between contiguous arrays may not be equal to the sum of the distances to intermediate arrays due to rounding. For example, the x distance between arrays 2 and 3 is 22.96 feet, which is not equal to 6.32 + 16.63 (the x distances between arrays 1 and 2 and arrays 1 and 3, respectively).'
      operationId: rackingArrays
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: design_id
        in: path
        description: The ID of the design to retrieve racking arrays for.
        required: true
        schema:
          type: string
          format: uuid
      - name: max_module_spacing
        in: query
        description: Maximum spacing in centimeters between modules for them to be considered adjacent. It may be necessary to pad the expected value to get the desired results. We suggest adding 0.05cm to the expected value. Defaults to 2.6.
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 10
          example: 1.5
      responses:
        '200':
          description: Racking arrays successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  racking_arrays:
                    type: array
                    items:
                      type: object
                      properties:
                        units_of_measurement:
                          type: string
                          description: Units used for areas and lengths, as determined by the tenant setting for units.
                          enum:
                          - Imperial
                          - Metric
                        rows:
                          type: integer
                          description: Number of rows of modules in the grid representation of the array. Rows are parallel to the roof ridge/eave.
                          example: 1
                        columns:
                          type: integer
                          description: Number of columns of modules in the grid representation of the array. Columns are perpendicular to the roof ridge/eave.
                          example: 7
                        array_layout:
                          type: array
                          description: Representation of the modules in the array as a list of rows. Rows appear in order from the ridgeline down to the eave.
                          items:
                            type: string
                            description: Representation of one row of modules in the grid. Each position in the grid is represented by a 0 if empty, P if it contains a module in portrait orientation, or L if it contains a module in landscape orientation.
                            example: PPPPPPP
                          example:
                          - PPPPPPP
                        ground_mounted:
                          type: boolean
                          description: Flag indicating whether modules are mounted on the ground (true) or on a roof surface (false).
                          example: false
                        pitch:
                          type: number
                          format: double
                          description: Pitch of the mounting plane in degrees between 0 to 90.
                          example: 20.25
                        azimuth:
                          type: number
                          format: double
                          description: Azimuth of the mounting plane in degrees between 0 (North) to 360.
                          example: 179.61
                        tilt:
                          type: number
                          format: double
                          description: Tilt of the modules relative to the mounting plane in degrees between 0 to 90.
                          example: 15
                        rotation:
                          type: number
                          format: double
                          description: Rotation of the modules relative to the mounting plane in degrees between 0 to 360.
                          example: 10.61
                        adjacent_arrays:
                          type: array
                          items:
                            type: object
                            properties:
                              idx:
                                type: integer
                                description: Index of the adjacent array in racking_arrays, starting from 0.
                                example: 0
                              x:
                                type: number
                                format: double
                                description: Distance in the x direction in feet/meters from this array to the adjacent array, measured from the center of the top left module in each array. Positive numbers indicate modules to the right.
                                example: 12.08
                              y:
                                type: number
                                format: double
                                description: Distance in the y direction in feet/meters from this array to the adjacent array, measured from the center of the top left module in each array. Positive numbers indicate modules higher on the roof.
                                example: 4.64
                        module:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The Unique ID for the module in Aurora.
                              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            manufacturer:
                              type:
                              - string
                              - 'null'
                              description: Manufacturer name of the module.
                              example: Sunpreme
                            rating_stc:
                              type: number
                              format: double
                              description: STC rating of the module in Watts
                              example: 300.25
                            name:
                              type: string
                              description: Component name of the module
                              example: SNPM GxB 300
                            count:
                              type: integer
                              description: Number of modules in the array.
                              example: 7
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
