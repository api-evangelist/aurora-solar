openapi: 3.2.0
info:
  title: Sync Designs API
  description: This Aurora Integration API allows authorized clients and 3rd parties to easily read, update, and create resources/objects with specific parameters within Aurora. You can find out more about Aurora Solar here.
  version: 2024.05.0
  contact:
    name: Aurora Solar Support
    email: support@aurorasolar.com
servers:
- url: https://api-sandbox.aurorasolar.com
  description: Sandbox Environment
security:
- bearerAuth: []
tags:
- name: Designs
paths:
  /tenants/{tenant_id}/projects/{id}/designs:
    get:
      tags:
      - Designs
      summary: List Designs
      description: 'Returns a list of designs.


        ---


        Designs are returned sorted in descending order based on creation date.'
      operationId: listDesigns
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant to get designs for.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the project to get designs for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Designs successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  designs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique ID identifying the design.
                        external_provider_id:
                          type: string
                          description: Unique ID of design provided by external provider.
                          example: YourId123
                        name:
                          type: string
                          description: Name of the design.
                          example: My first test design
                        created_at:
                          type: string
                          description: The timestamp of when the design was created, formatted as "YYYY-MM-DD HH:MM:SS UTC"
                          example: 2023-07-11 18:43:18 UTC
                        system_size_ac:
                          type: number
                          format: double
                          description: Size of design in Watts (AC)
                        system_size_ptc:
                          type: number
                          format: double
                          description: Size of design in Watts (DC, PTC)
                        system_size_stc:
                          type: number
                          format: double
                          description: Size of design in Watts (DC, STC)
                        milestone:
                          type:
                          - object
                          - 'null'
                          description: The latest milestone for the design. Null if no milestone has been set.
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the milestone.
                            milestone:
                              type: string
                              description: The milestone of the design
                              enum:
                              - offer
                              - sold
                              - installed
                              - permission_to_operate
                              - change_order
                              - revised
                              - canceled
                            notes:
                              type: string
                              description: Notes for the milestone
                              example: Customer signed contract
                            recorded_at:
                              type: string
                              format: date-time
                              description: The timestamp of when the milestone was recorded in UTC.
                            canceled_from_milestone:
                              type:
                              - string
                              - 'null'
                              description: The milestone before the design was marked canceled. Null if the current milestone is not canceled.
                              enum:
                              - offer
                              - sold
                              - installed
                              - permission_to_operate
                              - change_order
                              - revised
                            change_order_types:
                              type: array
                              description: Reasons for the change order. Empty unless milestone is "change_order".
                              items:
                                type: string
                                enum:
                                - homeowner_request
                                - equipment_availability_change
                                - financier_requirement
                                - storage_add_on
                                - design_layout_update
                                - other
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 84634864-3324-34af-fa00-1548796facbd could not be found
  /tenants/{tenant_id}/designs:
    post:
      tags:
      - Designs
      summary: Create Design
      description: 'Create a new design for a project.


        ---


        The returned design ID allows you to create a deep link into the Aurora application. That way, you can direct users to a specific design within a specific project. Please note, a design must always belong to a project. Therefore the `project_id` must always be provided.'
      operationId: createDesign
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant to create the design in.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                design:
                  type: object
                  description: Design to create.
                  required:
                  - project_id
                  - name
                  properties:
                    external_provider_id:
                      type: string
                      maxLength: 255
                      description: Unique ID of design provided by external provider.
                      example: YourId123
                    project_id:
                      type: string
                      format: uuid
                      description: Unique ID identifying the project that this design belongs to.
                    name:
                      type: string
                      maxLength: 255
                      description: Name of the design.
                      example: My first test design
      responses:
        '200':
          description: Design successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  design:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design.
                      external_provider_id:
                        type: string
                        description: Unique ID of design provided by external provider.
                        example: YourId123
                      project_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the project that this design belongs to.
                      name:
                        type: string
                        description: Name of the design.
                        example: My first test design
                      design_request_id:
                        type: string
                        format: uuid
                        description: For designs created via a [design request](ref:design-requests), unique ID for the design request.
                      created_at:
                        type: string
                        format: date-time
                        description: The timestamp of when the design was created in UTC.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 84634864-3324-34af-fa00-1548796facbd could not be found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Something went wrong
                    - message: Something else went wrong
                    - message: It's really not your day, is it?
  /tenants/{tenant_id}/designs/{id}/duplicate:
    post:
      tags:
      - Designs
      summary: Duplicate Design
      description: 'Duplicates an existing design.


        ---


        The duplicate design includes the 3D model, the PV system, storage, and pricing. It will also be in the same project as the original design.'
      operationId: duplicateDesign
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant for the design to duplicate.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to duplicate.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                design:
                  type: object
                  description: Override fields for duplicated design.
                  properties:
                    external_provider_id:
                      type: string
                      maxLength: 255
                      description: Unique ID of duplicate design provided by external provider.
                      example: YourId123
                    name:
                      type: string
                      maxLength: 255
                      description: Name of the duplicate design. Defaults to name of original design with `" (Copy)"` appended.
                      example: My first test design (Copy)
      responses:
        '200':
          description: Design successfully duplicated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  design:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design.
                      external_provider_id:
                        type: string
                        description: Unique ID of design provided by external provider.
                        example: YourId123
                      project_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the project that this design belongs to.
                      name:
                        type: string
                        description: Name of the design.
                        example: My first test design
                      design_request_id:
                        type: string
                        format: uuid
                        description: For designs created via a [design request](ref:design-requests), unique ID for the design request.
                      created_at:
                        type: string
                        format: date-time
                        description: The timestamp of when the design was created in UTC.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 84634864-3324-34af-fa00-1548796facbd could not be found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Something went wrong
                    - message: Something else went wrong
                    - message: It's really not your day, is it?
  /tenants/{tenant_id}/designs/{id}:
    get:
      tags:
      - Designs
      summary: Retrieve Design
      description: Retrieve a design
      operationId: retrieveDesign
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant to retrieve the design in.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Design successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  design:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design.
                      external_provider_id:
                        type: string
                        description: Unique ID of design provided by external provider.
                        example: YourId123
                      project_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the project that this design belongs to.
                      name:
                        type: string
                        description: Name of the design.
                        example: My first test design
                      design_request_id:
                        type: string
                        format: uuid
                        description: For designs created via a [design request](ref:design-requests), unique ID for the design request.
                      milestone:
                        type:
                        - object
                        - 'null'
                        description: The latest milestone for the design. Null if no milestone has been set.
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Unique ID identifying the milestone.
                          milestone:
                            type: string
                            description: The milestone of the design
                            enum:
                            - offer
                            - sold
                            - installed
                            - permission_to_operate
                            - change_order
                            - revised
                            - canceled
                          notes:
                            type: string
                            description: Notes for the milestone
                            example: Customer signed contract
                          recorded_at:
                            type: string
                            format: date-time
                            description: The timestamp of when the milestone was recorded in UTC.
                          canceled_from_milestone:
                            type:
                            - string
                            - 'null'
                            description: The milestone before the design was marked canceled. Null if the current milestone is not canceled.
                            enum:
                            - offer
                            - sold
                            - installed
                            - permission_to_operate
                            - change_order
                            - revised
                          change_order_types:
                            type: array
                            description: Reasons for the change order. Empty unless milestone is "change_order".
                            items:
                              type: string
                              enum:
                              - homeowner_request
                              - equipment_availability_change
                              - financier_requirement
                              - storage_add_on
                              - design_layout_update
                              - other
                      created_at:
                        type: string
                        format: date-time
                        description: The timestamp of when the design was created in UTC.
                      image_src:
                        type: string
                        enum:
                        - Google
                        - Bing
                        - Google HD (Sunroof)
                        - Nearmap
                        - Nearmap (True Ortho)
                        - Vexcel
                        - Custom
                        - Unknown
                        - Multiple
                        - In Progress
                        - None
                        description: The imagery source selected in this design. "Multiple" indicates that multiple sources are selected. "In Progress" indicates that the image is still being downloaded. "None" indicates that no image source is selected. "Custom" indicates a user-uploaded or drone image. "Unknown" indicates that the image source is undetermined.
                      lidar_src:
                        type: string
                        enum:
                        - Google Sunroof
                        - Aurora Lidar
                        - Vexcel Lidar
                        - Custom
                        - Unknown
                        - In Progress
                        - None
                        description: The Lidar source selected in this design. "In Progress" indicates that the Lidar data is still being downloaded. "None" indicates no Lidar source is available. "Custom" indicates a user-uploaded or drone Lidar source. "Unknown" indicates that the Lidar source is undetermined.
                      image_metadata:
                        type: object
                        required:
                        - capture_date
                        - resolution
                        description: Metadata for the imagery selected in this design. Populated only when `image_src` is a single completed, recognized source. Availability varies by provider and record age. Nearmap, Vexcel, EagleView, and Google HD (Sunroof) imagery often include capture date and may include resolution; Google and Bing generally provide neither. Values are null when unavailable or when `image_src` is None, Multiple, In Progress, or Unknown.
                        properties:
                          capture_date:
                            type:
                            - string
                            - 'null'
                            format: date
                            description: Calendar date on which the imagery was captured, when provided by the imagery provider.
                            example: '2024-03-19'
                          resolution:
                            type:
                            - number
                            - 'null'
                            format: float
                            description: Ground sampling resolution in centimeters per pixel, when provided by the imagery provider.
                            example: 5.5
                            exclusiveMinimum: 0
                      lidar_metadata:
                        type: object
                        required:
                        - capture_date
                        description: Metadata for the Lidar source selected in this design. Populated only when `lidar_src` is a single completed, recognized source. Availability varies by provider and record age. Resolution is not exposed for Lidar because the stored data may have been downsampled. Values are null when unavailable or when `lidar_src` is None, In Progress, or Unknown.
                        properties:
                          capture_date:
                            type:
                            - string
                            - 'null'
                            format: date
                            description: Calendar date on which Lidar capture began, when available. For Aurora Lidar flights spanning multiple days, this is the start of the capture window; the end date is not returned.
                            example: '2024-03-19'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 84634864-3324-34af-fa00-1548796facbd could not be found
    put:
      tags:
      - Designs
      summary: Update Design
      description: Update a design's name and latest milestone.
      operationId: updateDesign
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to update.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                design:
                  type: object
                  description: Design fields to update.
                  properties:
                    name:
                      type: string
                      maxLength: 255
                      description: Name of the design.
                      example: My first test design
                    milestone:
                      type: object
                      description: Latest milestone for the design
                      required:
                      - milestone
                      properties:
                        milestone:
                          type: string
                          description: The latest milestone to use for this design. Note that marking a design as sold will mark all other sold designs on the project as canceled. Setting this to "change_order" requires change_order_types to also be provided.
                          enum:
                          - offer
                          - sold
                          - installed
                          - permission_to_operate
                          - change_order
                          - revised
                          - canceled
                        notes:
                          type: string
                          description: Notes for the milestone
                          example: Customer signed contract
                        change_order_types:
                          type: array
                          description: Required when milestone is "change_order". One or more reasons for the change order.
                          items:
                            type: string
                            enum:
                            - homeowner_request
                            - equipment_availability_change
                            - financier_requirement
                            - storage_add_on
                            - design_layout_update
                            - other
                          example:
                          - homeowner_request
      responses:
        '200':
          description: Design successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  design:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design.
                      external_provider_id:
                        type: string
                        description: Unique ID of design provided by external provider.
                        example: YourId123
                      project_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the project that this design belongs to.
                      name:
                        type: string
                        description: Name of the design.
                        example: My first test design
                      design_request_id:
                        type: string
                        format: uuid
                        description: For designs created via a [design request](ref:design-requests), unique ID for the design request.
                      milestone:
                        type:
                        - object
                        - 'null'
                        description: The latest milestone for the design. Null if no milestone has been set.
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Unique ID identifying the milestone.
                          milestone:
                            type: string
                            description: The milestone of the design
                            enum:
                            - offer
                            - sold
                            - installed
                            - permission_to_operate
                            - change_order
                            - revised
                            - canceled
                          notes:
                            type: string
                            description: Notes for the milestone
                            example: Customer signed contract
                          recorded_at:
                            type: string
                            format: date-time
                            description: The timestamp of when the milestone was recorded in UTC.
                          canceled_from_milestone:
                            type:
                            - string
                            - 'null'
                            description: The milestone before the design was marked canceled. Null if the current milestone is not canceled.
                            enum:
                            - offer
                            - sold
                            - installed
                            - permission_to_operate
                            - change_order
                            - revised
                          change_order_types:
                            type: array
                            description: Reasons for the change order. Empty unless milestone is "change_order".
                            items:
                              type: string
                              enum:
                              - homeowner_request
                              - equipment_availability_change
                              - financier_requirement
                              - storage_add_on
                              - design_layout_update
                              - other
                      created_at:
                        type: string
                        format: date-time
                        description: The timestamp of when the design was created in UTC.
                      image_src:
                        type: string
                        enum:
                        - Google
                        - Bing
                        - Google HD (Sunroof)
                        - Nearmap
                        - Nearmap (True Ortho)
                        - Vexcel
                        - Custom
                        - Unknown
                        - Multiple
                        - In Progress
                        - None
                        description: The imagery source selected in this design. "Multiple" indicates that multiple sources are selected. "In Progress" indicates that the image is still being downloaded. "None" indicates that no image source is selected. "Custom" indicates a user-uploaded or drone image. "Unknown" indicates that the image source is undetermined.
                      lidar_src:
                        type: string
                        enum:
                        - Google Sunroof
                        - Aurora Lidar
                        - Vexcel Lidar
                        - Custom
                        - Unknown
                        - In Progress
                        - None
                        description: The Lidar source selected in this design. "In Progress" indicates that the Lidar data is still being downloaded. "None" indicates no Lidar source is available. "Custom" indicates a user-uploaded or drone Lidar source. "Unknown" indicates that the Lidar source is undetermined.
                      image_metadata:
                        type: object
                        required:
                        - capture_date
                        - resolution
                        description: Metadata for the imagery selected in this design. Populated only when `image_src` is a single completed, recognized source. Availability varies by provider and record age. Nearmap, Vexcel, EagleView, and Google HD (Sunroof) imagery often include capture date and may include resolution; Google and Bing generally provide neither. Values are null when unavailable or when `image_src` is None, Multiple, In Progress, or Unknown.
                        properties:
                          capture_date:
                            type:
                            - string
                            - 'null'
                            format: date
                            description: Calendar date on which the imagery was captured, when provided by the imagery provider.
                            example: '2024-03-19'
                          resolution:
                            type:
                            - number
                            - 'null'
                            format: float
                            description: Ground sampling resolution in centimeters per pixel, when provided by the imagery provider.
                            example: 5.5
                            exclusiveMinimum: 0
                      lidar_metadata:
                        type: object
                        required:
                        - capture_date
                        description: Metadata for the Lidar source selected in this design. Populated only when `lidar_src` is a single completed, recognized source. Availability varies by provider and record age. Resolution is not exposed for Lidar because the stored data may have been downsampled. Values are null when unavailable or when `lidar_src` is None, In Progress, or Unknown.
                        properties:
                          capture_date:
                            type:
                            - string
                            - 'null'
                            format: date
                            description: Calendar date on which Lidar capture began, when available. For Aurora Lidar flights spanning multiple days, this is the start of the capture window; the end date is not returned.
                            example: '2024-03-19'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
