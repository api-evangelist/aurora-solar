                    - message: Something else went wrong
                    - message: It's really not your day, is it?
  /tenants/{tenant_id}/designs/{id}/summary:
    get:
      tags:
      - Designs
      summary: Retrieve Design Summary
      description: 'Retrieve the summary of a design.


        ---


        This action allows you to pass back Aurora design information into your own systems. You will likely call this endpoint after a user has modified a design within the Aurora application and intends to return back to the portal or primary application he/she originally came from (Salesforce, SugarCRM...).


        The design summary contains a field called ''arrays''. The contents of the field is a JSON string containing details of the solar system designed. Each array is a group of solar modules that have the same roof face, module model, azimuth, pitch, orientation (portrait vs. landscape), MLPE (module level power electronics, such as microinverter or dc-optimizer) and which connect to the same MPPT within a string inverter. Example: let''s assume you have a house with a simple gable roof (''A''-roof), where one side is south-facing and the other north. Furthermore, let''s assume that that you install a 8kW system consisting of 32 x 250 Watt modules. 8 of them on the north-facing roof and 24 of them on the south-facing roof connecting to two different inverters. There would be 2 arrays in the design summary, one with "face = 1" and the other with "face = 2". Please note that the "face" IDs are not guaranteed to reflect the same directionality (i.E. face 1 is not guaranteed to be South), instead they are a way of grouping arrays located on the same roof face. The "face" IDs are not included in the layout DXF files.


        Continuing the example above, connecting 8 of the 24 modules on the south-facing roof to microinverters, 8 to DC optimizers and stringing the remaining 8 to a central inverter would result in a total of 4 arrays in the design summary (one due to the roof face and 3 due to the usage of MLPE''s and/or a central string inverter).'
      operationId: retrieveDesignSummary
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to retrieve the summary for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Design Summary successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  design:
                    type: object
                    properties:
                      design_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design.
                      design_request_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the design request the design was created from.
                      external_provider_id:
                        type: string
                        description: Unique ID of design provided by external provider.
                        example: YourId123
                      project_id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the project that this design belongs to.
                      created_at:
                        type: string
                        description: The timestamp of when the design was created, formatted as "YYYY-MM-DD HH:MM:SS UTC"
                        example: 2023-07-11 18:43:18 UTC
                      bill_of_materials:
                        type: array
                        description: Array containing bill of materials
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the component. Null if the component is not managed in Aurora's database (ex. generic components or externally-managed components).
                            component_type:
                              type: string
                              enum:
                              - batteries
                              - cell_string_optimizers
                              - combiner_boxes
                              - dc_optimizers
                              - disconnects
                              - inverters
                              - load_centers
                              - meters
                              - microinverters
                              - modules
                              - racking_components
                              - service_panels
                              description: Type of component.
                              example: modules
                            sku:
                              type: string
                              description: Manufacturer specific SKU of the component. May be null for components managed by Aurora's database.
                              example: null
                            name:
                              type: string
                              description: Name of the component.
                              example: Aurora Sample Solar Panel
                            manufacturer_name:
                              type: string
                              description: Manufacturer name of the component.
                              example: Aurora Sample Manufacturer
                            quantity:
                              type: integer
                              description: The number of components used in the design.
                              example: 1
                      system_size_ac:
                        type: number
                        format: double
                        description: Size of design in Watts (AC)
                        example: 5000
                      system_size_ptc:
                        type: number
                        format: double
                        description: Size of design in Watts (DC, PTC)
                        example: 6000
                      system_size_stc:
                        type: number
                        format: double
                        description: Size of design in Watts (DC, STC)
                        example: 6500
                      arrays:
                        type: array
                        description: List of PV arrays grouped by tilt, azimuth, inverter.
                        items:
                          type: object
                          properties:
                            size:
                              type: number
                              format: double
                              description: DC array size in Watts
                              example: 6500
                            azimuth:
                              type: number
                              format: double
                              description: Azimuth in degrees between 0 (North) to 360
                              example: 271.61
                            configuration:
                              type: string
                              enum:
                              - string inverter
                              - microinverter
                              - dc optimizer
                              - no inverter/MLPE
                              description: Configuration option.
                            dc_optimizer:
                              type: object
                              description: Attached DC optimizer (not panel-integrated)
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique ID identifying the DC optimizer
                                name:
                                  type: string
                                  description: Component name of the DC optimizer
                                  example: Aurora Sample DC Optimizer
                                count:
                                  type: integer
                                  description: Number of DC Optimizers
                                  example: 11
                            microinverter:
                              type: object
                              description: Attached microinverter (not panel-integrated)
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique ID identifying the microinverter
                                name:
                                  type: string
                                  description: Component name of the microinverter
                                  example: Aurora Sample Microinverter
                                count:
                                  type: integer
                                  description: Number of microinverters
                                  example: 11
                                rated_power:
                                  type: number
                                  description: Rated power of the microinverter in Watts
                                  example: 400
                            integrated_microinverter:
                              type: object
                              description: Panel-integrated microinverter. Present only when modules have an integrated microinverter; mutually exclusive with `microinverter`.
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique ID identifying the integrated microinverter
                                name:
                                  type: string
                                  description: Component name of the integrated microinverter
                                  example: Aurora Sample Integrated Microinverter
                                count:
                                  type: integer
                                  description: Number of integrated microinverters (equal to module count)
                                  example: 11
                                rated_power:
                                  type: number
                                  description: Rated power of the integrated microinverter in Watts
                                  example: 400
                            integrated_dc_optimizer:
                              type: object
                              description: Panel-integrated DC optimizer. Present only when modules have an integrated DC optimizer; mutually exclusive with `dc_optimizer`.
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique ID identifying the integrated DC optimizer
                                name:
                                  type: string
                                  description: Component name of the integrated DC optimizer
                                  example: Aurora Sample Integrated DC Optimizer
                                count:
                                  type: integer
                                  description: Number of integrated DC optimizers (equal to module count)
                                  example: 11
                            module:
                              type: object
                              description: Solar Panel
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique ID identifying the solar module
                                rating_stc:
                                  type: number
                                  format: double
                                  description: STC rating of the module in Watts
                                  example: 300.25
                                name:
                                  type: string
                                  description: Component name of the solar module
                                  example: Aurora Sample Solar Panel
                                count:
                                  type: integer
                                  description: Number of solar modules
                                  example: 11
                                orientation:
                                  type: string
                                  enum:
                                  - landscape
                                  - portrait
                                  description: Orientation of the module.
                            face:
                              type: integer
                              description: Identifier of the roof face on the house in the 3D model (1-indexed, i.e. 1,2,3...). Arrays/modules placed outside of the roof outline, the face will be -1. The roof face gets recalculated when the 3D model changes, i.e. adding a roof may change a previously labeled roof face 1 into roof face 2.
                              example: 1
                            ground_mounted:
                              type: boolean
                              description: True if the modules are mounted on the ground; false if they are mounted on a roof face.
                            pitch:
                              type: number
                              format: double
                              description: Pitch of the module in degrees between 0 to 90
                              example: 20.25
                            strings:
                              type: object
                              description: Strings
                              properties:
                                count:
                                  type: integer
                                  description: Number of strings in the array
                                  example: 1
                            string_inverter:
                              type: object
                              description: Inverter
                              properties:
                                index:
                                  type: integer
                                  description: Index of string inverter below (1-indexed)
                                  example: 1
                            shading:
                              type: object
                              description: Shading values
                              properties:
                                solar_access:
                                  type: object
                                  description: Solar Access Percentage (SAP) values
                                  properties:
                                    annual:
                                      type: number
                                      format: double
                                      description: Average annual SAP value
                                      example: 87.3
                                    monthly:
                                      type: array
                                      description: Monthly SAP
                                      items:
                                        type: number
                                        format: double
                                      example:
                                      - 81.1
                                      - 82.2
                                      - 83
                                      - 84
                                      - 85
                                      - 86
                                      - 87
                                      - 88
                                      - 89
                                      - 90
                                      - 91
                                      - 92
                                total_solar_resource_fraction:
                                  type: object
                                  properties:
                                    annual:
                                      type: number
                                      format: double
                                      description: Average annual TSRF value
                                      example: 87.3
                      string_inverters:
                        type: array
                        description: List of string inverter.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the string inverter.
                            name:
                              type: string
                              description: Component name of the string inverter.
                              example: Aurora Sample String Inverter
                            rated_power:
                              type: number
                              format: double
                              description: Size of the string inverter in Watts.
                              example: 42000
                      storage_inverters:
                        type: array
                        description: List of inverters included in the storage design.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the inverter.
                            name:
                              type: string
                              description: Component name of the inverter.
                              example: Aurora Sample Storage Inverter
                            rated_power:
                              type: number
                              format: double
                              description: Size of the inverter in Watts.
                              example: 5800
                      batteries:
                        type: array
                        description: List of batteries included in the storage design.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Unique ID identifying the battery.
                            name:
                              type: string
                              description: Component name of the battery.
                              example: Aurora Sample Battery
                            has_integrated_inverter:
                              type: boolean
                              description: Describes whether the battery has an integrated inverter or not.
                              example: true
                      energy_production:
                        type: object
                        description: Energy production of the designed PV system in kWh. Data is only present if performance simulation has been run
                        properties:
                          up_to_date:
                            type: boolean
                            description: True if the performance simulation has been successfully run and the results are up-to-date, false otherwise.
                          annual:
                            type: number
                            format: double
                            description: Total annual energy production.
                            example: 2550.3
                          annual_offset:
                            type: string
                            description: Annual energy offset (percentage of address energy consumption covered by the design's energy production)
                            example: 87%
                          monthly:
                            type: array
                            description: Energy production broken down by month
                            items:
                              type: number
                              format: double
                            example:
                            - 150.1
                            - 150.2
                            - 150
                            - 200
                            - 200
                            - 200
                            - 300
                            - 300
                            - 300
                            - 200
                            - 200
                            - 200
                          hourly:
                            type: array
                            description: Energy production broken down by hour (8760 values)
                            items:
                              type: number
                              format: double
                            example: null
                          loss_summary:
                            type: array
                            description: 'Ordered list of energy loss steps from the performance simulation. Each entry represents one stage in the loss waterfall — the energy or irradiance remaining after applying that loss. Entries must be processed in order; loss_percentage is computed relative to the immediately preceding entry. An empty array is returned when no performance simulation has been run. See the [System Loss Settings API](ref:retrievedesignsystemlosssettings) for the mapping between editable loss settings and these loss-summary stages.

                              '
                            items:
                              type: object
                              properties:
                                category:
                                  type: string
                                  enum:
                                  - irradiance
                                  - dc
                                  - ac
                                  - other
                                  description: The loss group this entry belongs to.
                                name:
                                  type: string
                                  description: Identifier for this loss step, as produced by the simulation engine.
                                  example: irradiance_after_soiling_loss
                                value:
                                  type: integer
                                  description: Absolute irradiance or energy remaining at this step, rounded to the nearest integer.
                                  example: 1972
                                units:
                                  type: string
                                  enum:
                                  - kWh/m²
                                  - kWh
                                  description: 'Unit for the value field. kWh/m² for irradiance category entries (annual insolation); kWh for dc, ac, and other category entries.

                                    '
                                  example: kWh/m²
                                loss_percentage:
                                  type:
                                  - number
                                  - 'null'
                                  format: double
                                  description: 'Percentage loss relative to the immediately preceding entry''s value, rounded to 1 decimal place (e.g. -2.0 means 2% loss). Null only for the very first irradiance entry and the very first dc entry (reference points on different scales). All other entries — including the first ac and first other entries — have a non-null loss_percentage.

                                    '
                                  example: -2
                          total_configured_loss_percentage:
                            type:
                            - number
                            - 'null'
                            format: double
                            description: 'The cumulative loss from the user-configured derate inputs, displayed as "Estimated total loss" in Design Mode, as a percentage rounded to 1 decimal place (e.g. 8.6 means 8.6% total loss). Computed as a compound product of the configured per-loss derates (1 - Π(1 - lossᵢ)), not a simple sum. Excludes losses computed automatically by the simulation engine (e.g. the shading derate when the shading engine is enabled), so this value will differ from the full loss waterfall in loss_summary. Returns 0.0 when losses are configured but the computed net derate is zero (including when the shading engine excludes all applicable derates) — this is distinct from null, which means no performance simulation has been run or no system losses are configured.

                              '
                            example: 8.6
                      storage_selected_operating_mode:
                        type: string
                        description: How storage system performance is simulated. Affects avoided cost and financial analyses.
                        enum:
                        - backup
                        - self_consumption
                        - energy_arbitrage
                      backup_enabled:
                        type:
                        - boolean
                        - 'null'
                        description: Whether backup functionality is enabled for the storage system. Only present if the design has a storage system.
                        example: true
                      lidar_shading_enabled:
                        type: boolean
                        description: Whether lidar-based shading is enabled for this design.
                      lidar_has_areas_removed:
                        type: boolean
                        description: Whether at least one area has been removed from Lidar on this design.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: 'Expected UUID but received non-UUID value for the follow URL parameters: [:tenant_id]'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: Invalid bearer token.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: This endpoint is not provisioned for this key. To provision, please contact your Aurora account team.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
                  required:
                  - errors
                - example:
                    errors:
                    - message: The project with id 84634864-3324-34af-fa00-1548796facbd could not be found
  /tenants/{tenant_id}/designs/{id}/system_loss_settings:
    get:
      tags:
      - Designs
      summary: Retrieve System Loss Settings
      description: 'Retrieve the editable per-design system-loss settings: the input derate percentages and

        their lock state.


        ---


        These are the **editable inputs** to the performance simulation. They are distinct from the

        computed loss waterfall returned under `energy_production.loss_summary` by the

        Design Summary endpoint, which reports the irradiance/energy

        remaining after each stage. Each editable setting maps to exactly one `loss_summary` stage —

        see the mapping table on Update System Loss Settings.


        Values are percentages (e.g. `2.0` represents a 2% loss). Only annual values are supported.'
      operationId: retrieveDesignSystemLossSettings
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the design to retrieve system loss settings for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: System loss settings successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  system_loss_settings:
                    type: object
                    properties:
                      editable:
                        type: boolean
                        description: Whether the losses can be edited. False when a financing product dictates them.
                        example: true
                      locked_by_financier:
                        type:
                        - string
                        - 'null'
                        description: The financing product code locking all losses, or null when not financier-locked.
                        example: null
                      values:
                        type: object
                        description: The editable losses, keyed by loss name. Values are percentages (0-100).
                        properties:
                          soiling:
                            type: object
                            properties:
                              value:
                                type: number
                                format: double
                                description: The loss as a percentage (0-100).
                                example: 2
                              locked:
                                type: boolean
                                description: Whether this loss is currently read-only.
                                example: false
                              disabled_reason:
                                type:
                                - string
                                - 'null'
                                enum:
                                - financier
                                - shading_engine_enabled
                                description: Why the loss is locked, or null when it is editable.
                                example: null
                          snow:
                            type: object
                            properties:
                              value:
                                type: number
                                format: double
                                description: The loss as a percentage (0-100).
                                example: 2
                              locked:
                                type: boolean
                                description: Whether this loss is currently read-only.
                                example: false
                              disabled_reason:
                                type:
                                - string
                                - 'null'
                                enum:
                                - financier
                                - shading_engine_enabled
                                description: Why the loss is locked, or null when it is editable.
                                example: null
                          shading:
                            type: object
                            properties:
                              value:
                                type: number
                                format: double
                                description: The loss as a percentage (0-100).
                                example: 2
                              locked:
                                type: boolean
                                description: Whether this loss is currently read-only.
                                example: false
                              disabled_reason:
                                type:
                                - string
                                - 'null'
                                enum:
                                - financier
                                - shading_engine_enabled
                                description: Why the loss is locked, or null when it is editable.
                                example: null
                          mismatch:
                            type: object
                            properties:
                              value:
                                type: number
                                format: double
                                description: The loss as a percentage (0-100).
                                example: 2
                              locked:
                                type: boolean
                                description: Whether this loss is currently read-only.
                                example: false
                              disabled_reason:
                                type:
                                - string
                                - 'null'
                                enum:
                                - financier
                                - shading_engine_enabled
                                description: Why the loss is locked, or null when it is editable.
                                example: null
                          wiring:
                            type: object
                            properties:
                              value:
