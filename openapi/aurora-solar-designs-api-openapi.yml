  /tenants/{tenant_id}/designs/{design_id}/roof_summary:
    get:
      tags:
      - Designs
      summary: Retrieve Roof Summary
      description: 'Retrieve summary of all roofs for a design.


        ---

        In Aurora, a roof is a set of roof faces within 1 square foot of each other. A roof''s area is the sum of its roof face areas. Note that the pitch for a roof is only returned if all faces in the roof have the same pitch.


        Please note for simple roof faces in Aurora, roof edge types are not set automatically, and will need to be set manually when designing a roof. Roofs created with SmartRoof and AI Roof will automatically have edge types set.


        We determine the shape of each roof face using the following heuristics in the order listed:

        - Flat: roof with 2:12 slope (9.46 degrees) or less

        - Monopitch: roof with a single face with a pitch greater than 2:12 (9.46 degrees)

        - Hip: roof where the length of hip edges is greater than the length of rake edges

        - Gable: roof with at least one rake


        Units for all lengths and areas will be imperial or metric depending on the tenant setting in the Aurora app.


        [block:callout]

        {

        "type": "warning",

        "body": "Please note if your design''s project has an accepted legacy EagleView Design Request, you will receive a 422 error when calling Retrieve Roof Summary."

        }

        [/block]'
      operationId: roofSummary
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the design is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: design_id
        in: path
        description: The ID of the design to retrieve roof summary for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Roof summary successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roofs:
                    type: array
                    items:
                      type: object
                      allOf:
                      - type: object
                        properties:
                          units_of_measurement:
                            type: string
                            description: Units used for areas and lengths, as determined by the tenant setting for units.
                            enum:
                            - Imperial
                            - Metric
                          shape:
                            type: string
                            description: The shape of the roof. If a shape cannot be determined, `"undefined"` will be returned.
                            enum:
                            - flat
                            - monopitch
                            - hip
                            - gable
                            - undefined
                          area:
                            type: number
                            description: Total area in roof, measured in sq. feet or sq. meters. Accurate to 0.1 sq. ft. or 0.01 sq. meters.
                            example: 1500
                          modules_area:
                            type: number
                            description: Total area of modules on roof, measured in sq. feet or sq. meters. Accurate to 0.1 sq. ft. or 0.01 sq. meters.
                            example: 750
                          pitch:
                            type: number
                            description: Pitch of roof, measured in degrees. Null if roof faces have different pitch.
                            example: null
                          effective_mean_height:
                            type: number
                            description: Effective roof height in accordance to ASCE 7, measured in feet or meters. Determined by the highest mean height of a roof face with modules on it. Null if roof has no modules.
                            example: 25
                          modules:
                            type: boolean
                            description: Whether roof has any solar modules on it.
                          obstructions:
                            type: object
                            description: Metadata for the obstructions on the roof. An obstruction's center must be inside the bounds of the roof to be considered "on" that roof.
                            properties:
                              circle_count:
                                type: number
                                description: Count of circle obstructions on this roof.
                                example: 1
                              polygon_count:
                                type: number
                                description: Count of polygon (including rectangle) obstructions on this roof.
                                example: 1
                          edges_length:
                            type: object
                            description: The edge lengths of the roof. Includes dormer edges, but does not include edges produced by obstructions.
                            properties:
                              eave:
                                type: string
                                description: The total length of eave edges on this roof, measured in feet or meters. Accurate to 0.1 feet or 0.03 meters.
                                example: 100
                              hip:
                                type: string
                                description: The total length of hip edges on this roof, measured in feet or meters. Accurate to 0.1 feet or 0.03 meters.
                                example: 100
                              rake:
                                type: string
                                description: The total length of rake edges on this roof, measured in feet or meters. Accurate to 0.1 feet or 0.03 meters.
                                example: 100
                              ridge:
                                type: string
                                description: The total length of ridge edges on this roof, measured in feet or meters. Accurate to 0.1 feet or 0.03 meters.
                                example: 100
                              valley:
                                type: string
                                description: The total length of valley edges on this roof, measured in feet or meters. Accurate to 0.1 feet or 0.03 meters.
                                example: 100
                      - type: object
                        properties:
                          faces:
                            type: array
                            items:
                              properties:
                                units_of_measurement:
                                  type: string
                                  description: Units used for areas and lengths, as determined by the tenant setting for units.
                                  enum:
                                  - Imperial
                                  - Metric
                                area:
                                  type: number
                                  description: Total area of roof face, measured in sq. feet or sq. meters.
                                  example: 1000
                                modules_area:
                                  type: number
                                  description: Total area of modules on roof face, measured in sq. feet or sq. meters.
                                  example: 500
                                azimuth:
                                  type: number
                                  description: Azimuth of roof face, measured in degrees from N.
                                  example: 75
                                pitch:
                                  type: number
                                  description: Pitch of roof face, measured in degrees.
                                  example: 20
                                mean_height:
                                  type: number
                                  description: Mean height of roof in accordance to ASCE 7, measured in feet or meters.
                                  example: 25
                                eave_height:
                                  type: number
                                  description: Height of the eave (gutter line) above the ground, measured in feet or meters.
                                  example: 10
                                modules:
                                  type: boolean
                                  description: Whether roof face has any solar modules on it.
                                obstructions:
                                  type: object
                                  description: Metadata for the obstructions on this roof face. An obstruction is considered "on" a face if its center lies on that face.
                                  properties:
