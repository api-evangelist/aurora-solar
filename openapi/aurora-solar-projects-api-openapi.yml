      summary: Create Project Asset
      description: 'Create a project asset by uploading an image or document.


        ---


        A project can have a number of associated images or documents such as a picture of a meter, a roof, or other supporting material. An associated file can be a pdf, jpg, jpeg, png, gif, or webp file. Any other file formats will be rejected. The maximum size of an individual file is 15 MB. You may upload up to 100 assets per project. New assets will overwrite old assets with the same filename.'
      operationId: createProjectAsset
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that owns the project.
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        description: The ID of the project to upload an asset to.
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        description: 'Describes the uploaded content, including the filename of the asset. Must follow format: ''attachment; filename="<file_name>.<file_extension>"'''
        name: Content-Disposition
        required: true
        schema:
          type: string
        example: attachment; filename="meter_image.jpg"
      requestBody:
        description: File to upload, in binary format.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: Project Asset successfully uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_asset:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the asset within Aurora.
                      filename:
                        type: string
                        description: Base name of the file with extension.
                        example: meter_image.jpg
                      temporary_access_url:
                        type: string
                        description: Temporary URL to download the file (asset). Access expires after 24 hours. URL is refreshed on each request.
                        example: http://some-host.com/some-path/file2.png
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    errors:
