    get:
      tags:
      - Projects
      summary: Retrieve AHJ
      description: 'Retrieve an Authority Having Jurisdiction (AHJ).


        ---


        AHJ information is determined through a project''s property address according to the Census TIGER/Line Legal Boundary Shapefiles.'
      operationId: retrieveAHJ
      parameters:
      - name: tenant_id
        in: path
        description: The ID of the tenant that the AHJ is part of.
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: The ID of the AHJ to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: AHJ successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ahj:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique ID identifying the AHJ within Aurora.
                      name:
                        type: string
                        description: Name of the AHJ.
                        example: Green township
                      units_of_measurement:
                        type: string
                        description: Units used for areas, lengths, speeds, and loads throughout this AHJ object (including `structural_requirements.wind_speed` and `structural_requirements.snow_load`), as determined by the tenant setting for units.
                        enum:
                        - Imperial
                        - Metric
                      general_requirements:
                        type: object
                        description: General requirements for the AHJ.
                        properties:
                          wind_code:
                            type: string
                            description: Name of the applicable wind code.
                            example: ASCE 7-16
                      structural_requirements:
                        type: object
                        description: Structural requirements for the AHJ.
                        properties:
                          wind_speed:
                            type: number
                            format: double
                            description: Wind speed that must be supported in miles per hour or kilometers per hour.
                            example: 70
                          snow_load:
                            type: number
                            format: double
                            description: Weight of snow that must be supported in pounds per sq. foot or kilograms per sq. meter.
                            example: 10
                          max_span:
                            type: number
                            format: double
                            description: Maximum distance between racking attachment points in meters or inches.
                            example: 48
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          message:
                            type: string
