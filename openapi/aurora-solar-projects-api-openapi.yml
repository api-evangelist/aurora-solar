                          type: array
                          description: List of solar module unique IDs. When set, this list overrides the tenant's starred/partner-scoped module list in AutoDesigner (Sales Mode and Design Mode) — the listed modules are always available regardless of starring or partner assignment. This is not an unconditional override, though, other restrictions still apply, so a module must be non-deprecated and available for the project's state to be selectable, and admin/unrestricted catalog searches bypass it entirely. Setting a deprecated module ID is rejected.
                          items:
                            type: string
                            format: uuid
                            example: c5565198-91b8-46f1-97e6-db1973b2b4a3
                        preferred_solar_inverters:
                          type: array
                          description: List of solar inverter unique IDs. When set, this list overrides the tenant's starred/partner-scoped inverter list in AutoDesigner (Sales Mode and Design Mode), and overrides the tenant/partner's default Sales Mode inverter selection per inverter type (string vs. micro) — the listed inverters are always available regardless of starring or partner assignment. This is not an unconditional override, though, other restrictions still apply, so an inverter must be non-deprecated and available for the project's state to be selectable, and admin/unrestricted catalog searches bypass it entirely. Setting a deprecated inverter ID is rejected.
                          items:
