                          items:
                            type: string
                            format: uuid
                            example: c5565198-91b8-46f1-97e6-db1973b2b4a3
                        tags:
                          type: array
                          description: Tags associated with the project.
                          items:
                            type: string
                          example:
                          - third_party_1
                          - region_a
                    - type: object
                      properties:
                        location:
                          type: object
